<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRP & Co. LLP | Chartered Accountants, Wealth Managers & Valuation Professionals</title>
    <meta name="description" content="DRP & Co. LLP, Chartered Accountants established in 1995, providing audit, tax advisory, wealth management and valuation services from Pune, Maharashtra, India. FRN: W100047">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════════════════════
           DRP & Co. LLP — Design System + Homepage
           ═══════════════════════════════════════════════════════════ */

        :root {
            --navy: #1F3864;
            --navy-deep: #162a4d;
            --navy-light: #2a4a7a;
            --blue: #2E5FA3;
            --mid-blue: #4472C4;
            --light-blue: #D6E4F7;
            --ice: #EDF3FC;
            --gold: #B8860B;
            --gold-light: #D4A843;
            --gold-muted: rgba(184,134,11,0.12);
            --white: #FFFFFF;
            --off-white: #FAFBFD;
            --warm-gray: #F5F5F2;
            --border-light: rgba(31,56,100,0.06);
            --border-mid: rgba(31,56,100,0.12);
            --text-dark: #1a1a2e;
            --text-body: #3d3d56;
            --text-muted: #6b6b80;
            --text-on-dark: rgba(255,255,255,0.85);
            --text-on-dark-muted: rgba(255,255,255,0.45);
            --serif: 'DM Serif Display', Georgia, 'Times New Roman', serif;
            --sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --max-width: 1200px;
            --nav-height: 84px;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; font-size: 16px; scroll-padding-top: var(--nav-height); }
        body {
            font-family: var(--sans);
            color: var(--text-body);
            background: var(--white);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            line-height: 1.6;
        }
        a { color: inherit; text-decoration: none; }
        ul, ol { list-style: none; }
        img { max-width: 100%; display: block; }
        button { font-family: var(--sans); cursor: pointer; border: none; background: none; }
        .container { max-width: var(--max-width); margin: 0 auto; padding: 0 2rem; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

        /* ═══════════════════════════════════════════════════════════
           NAVBAR
           ═══════════════════════════════════════════════════════════ */
        .nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            height: var(--nav-height);
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border-light);
            transition: all 0.4s var(--ease-smooth);
        }
        .nav.scrolled { box-shadow: 0 1px 20px rgba(31,56,100,0.06); }
        .nav-inner {
            max-width: var(--max-width); margin: 0 auto; padding: 0 2rem;
            height: 100%; display: flex; align-items: center; justify-content: space-between;
        }
        .nav-brand { display: flex; align-items: center; gap: 0.7rem; flex-shrink: 0; }
        .nav-brand-mark {
            width: 40px; height: 40px; background: var(--navy); border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            color: var(--white); font-family: var(--serif); font-size: 1.05rem;
            letter-spacing: -0.02em; transition: transform 0.3s var(--ease-out);
        }
        .nav-brand:hover .nav-brand-mark { transform: scale(1.05); }
        .nav-logo { height: 76px; width: auto; transition: opacity 0.3s; } .nav-brand:hover .nav-logo { opacity: 0.85; }
        .nav-brand-text { display: flex; flex-direction: column; line-height: 1.15; }
        .nav-brand-name { font-family: var(--serif); font-size: 1.1rem; color: var(--navy); letter-spacing: -0.01em; }
        .nav-brand-sub { font-size: 0.6rem; color: var(--text-muted); letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500; }

        .nav-menu { display: flex; align-items: center; gap: 0; }
        .nav-item { position: relative; }
        .nav-link {
            display: flex; align-items: center; gap: 0.3rem; padding: 0.5rem 1rem;
            font-size: 0.84rem; font-weight: 500; color: var(--text-body);
            letter-spacing: 0.01em; transition: color 0.25s; white-space: nowrap;
        }
        .nav-link:hover { color: var(--navy); }
        .nav-link svg { width: 12px; height: 12px; opacity: 0.4; transition: transform 0.3s, opacity 0.3s; }
        .nav-item:hover .nav-link svg, .nav-item.open .nav-link svg { transform: rotate(180deg); opacity: 0.7; }

        .nav-actions { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
        .nav-cta {
            padding: 0.55rem 1.4rem; background: var(--navy); color: var(--white);
            border-radius: var(--radius-sm); font-size: 0.82rem; font-weight: 600;
            letter-spacing: 0.01em; transition: all 0.25s var(--ease-smooth);
        }
        .nav-cta:hover { background: var(--blue); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(31,56,100,0.2); }

        /* Login */
        .nav-login-wrap { position: relative; }
        .nav-login-btn {
            display: flex; align-items: center; gap: 0.4rem; padding: 0.5rem 0.85rem;
            font-size: 0.8rem; font-weight: 500; color: var(--text-muted);
            border: 1px solid var(--border-mid); border-radius: var(--radius-sm); transition: all 0.25s;
        }
        .nav-login-btn:hover { color: var(--navy); border-color: var(--navy); }
        .nav-login-btn svg { width: 14px; height: 14px; }
        .nav-login-btn .chevron { width: 10px; height: 10px; opacity: 0.4; transition: transform 0.3s; }
        .nav-login-wrap.open .nav-login-btn .chevron { transform: rotate(180deg); }
        .nav-login-wrap.open .nav-login-btn { color: var(--navy); border-color: var(--navy); background: var(--ice); }

        .login-dropdown {
            position: absolute; top: calc(100% + 8px); right: 0; width: 220px;
            background: var(--white); border-radius: var(--radius-md);
            box-shadow: 0 12px 40px rgba(31,56,100,0.12), 0 0 0 1px var(--border-light);
            opacity: 0; visibility: hidden; transform: translateY(6px);
            transition: all 0.25s var(--ease-out); padding: 0.5rem; z-index: 100;
        }
        .nav-login-wrap.open .login-dropdown { opacity: 1; visibility: visible; transform: translateY(0); }
        .login-dropdown-label { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); padding: 0.5rem 0.75rem 0.35rem; }
        .login-dropdown a {
            display: flex; align-items: center; gap: 0.6rem; padding: 0.6rem 0.75rem;
            border-radius: var(--radius-sm); font-size: 0.84rem; font-weight: 500; color: var(--text-body); transition: all 0.2s;
        }
        .login-dropdown a:hover { background: var(--ice); color: var(--navy); }
        .login-dropdown a svg { width: 16px; height: 16px; color: var(--mid-blue); flex-shrink: 0; }
        .login-dropdown a .arrow { margin-left: auto; width: 12px; height: 12px; opacity: 0; transform: translateX(-4px); transition: all 0.2s; color: var(--text-muted); }
        .login-dropdown a:hover .arrow { opacity: 0.6; transform: translateX(0); }

        /* Mega Menu */
        .mega-menu {
            position: fixed; top: var(--nav-height); left: 0; right: 0;
            background: var(--white); border-bottom: 1px solid var(--border-light);
            box-shadow: 0 20px 60px rgba(31,56,100,0.08);
            opacity: 0; visibility: hidden; transform: translateY(-4px);
            transition: all 0.3s var(--ease-out); z-index: 999;
        }
        .nav-item.open .mega-menu { opacity: 1; visibility: visible; transform: translateY(0); }
        .mega-menu-inner {
            max-width: var(--max-width); margin: 0 auto; padding: 2.5rem 2rem 2rem;
            display: grid; grid-template-columns: 1fr 1fr; gap: 3rem;
        }
        .mega-col-label {
            font-size: 0.65rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
            color: var(--text-muted); padding-bottom: 0.85rem; margin-bottom: 0.5rem; border-bottom: 1px solid var(--border-light);
        }
        .mega-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.65rem 0.75rem; margin: 0 -0.75rem; border-radius: var(--radius-sm); transition: all 0.2s; }
        .mega-link:hover { background: var(--ice); }
        .mega-link-icon {
            width: 36px; height: 36px; border-radius: var(--radius-sm); display: flex;
            align-items: center; justify-content: center; flex-shrink: 0; background: var(--ice); transition: background 0.2s;
        }
        .mega-link:hover .mega-link-icon { background: var(--light-blue); }
        .mega-link-icon svg { width: 18px; height: 18px; color: var(--blue); }
        .mega-link-text h4 { font-size: 0.88rem; font-weight: 600; color: var(--navy); margin-bottom: 0.1rem; }
        .mega-link-text p { font-size: 0.72rem; color: var(--text-muted); line-height: 1.4; }
        .nav-item--services::after { content: ''; position: absolute; bottom: -8px; left: 0; width: 100%; height: 8px; }

        /* Mobile Toggle */
        .nav-toggle { display: none; flex-direction: column; justify-content: center; gap: 5px; width: 32px; height: 32px; padding: 4px; }
        .nav-toggle span { width: 100%; height: 2px; background: var(--navy); border-radius: 2px; transition: all 0.3s var(--ease-out); transform-origin: center; }
        .nav-toggle.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .nav-toggle.active span:nth-child(2) { opacity: 0; transform: scaleX(0); }
        .nav-toggle.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

        /* Mobile Menu */
        .mobile-menu {
            display: none; position: fixed; top: var(--nav-height); left: 0; right: 0; bottom: 0;
            background: var(--white); z-index: 998; overflow-y: auto; padding: 2rem;
            transform: translateX(100%); transition: transform 0.4s var(--ease-out);
        }
        .mobile-menu.open { transform: translateX(0); }
        .mobile-nav-section { padding: 1rem 0; border-bottom: 1px solid var(--border-light); }
        .mobile-nav-section:last-child { border-bottom: none; }
        .mobile-nav-label { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem; }
        .mobile-nav-link { display: block; padding: 0.6rem 0; font-size: 0.95rem; font-weight: 500; color: var(--text-body); }
        .mobile-nav-link:hover { color: var(--navy); }
        .mobile-nav-sub { padding-left: 1rem; }
        .mobile-nav-sub .mobile-nav-link { font-size: 0.88rem; font-weight: 400; color: var(--text-muted); }
        .mobile-nav-cta { display: block; text-align: center; padding: 0.85rem; background: var(--navy); color: var(--white); border-radius: var(--radius-sm); font-size: 0.9rem; font-weight: 600; margin-top: 1rem; }
        .mobile-login-links { display: flex; gap: 0.75rem; margin-top: 1rem; }
        .mobile-login-links a { flex: 1; text-align: center; padding: 0.65rem; border: 1px solid var(--border-mid); border-radius: var(--radius-sm); font-size: 0.8rem; font-weight: 500; color: var(--text-muted); }
        .mobile-login-links a:hover { color: var(--navy); border-color: var(--navy); }

        /* ═══════════════════════════════════════════════════════════
           HERO SLIDER
           ═══════════════════════════════════════════════════════════ */
        .hero {
            position: relative;
            height: 92vh;
            min-height: 600px;
            max-height: 900px;
            margin-top: var(--nav-height);
            overflow: hidden;
            background: var(--navy-deep);
        }

        /* Slides */
        .hero-slide {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            opacity: 0;
            transition: opacity 0.8s var(--ease-smooth);
            pointer-events: none;
        }
        .hero-slide.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Slide backgrounds: photo sits on its own layer so it can drift
           slowly (panoramic pan) while the navy overlay and text stay still */
        .hero-slide--about {
            --hero-img: url('/assets/hero/slide-about.jpg');
            --hero-ov: linear-gradient(135deg, rgba(22,42,77,0.68) 0%, rgba(31,56,100,0.65) 40%, rgba(42,74,122,0.68) 100%);
            --hero-pan: heroPanRight;
        }
        .hero-slide--assurance {
            --hero-img: url('/assets/hero/slide-assurance.jpg');
            --hero-ov: linear-gradient(135deg, rgba(26,47,82,0.68) 0%, rgba(31,56,100,0.65) 50%, rgba(38,63,110,0.68) 100%);
            --hero-pan: heroPanLeft;
        }
        .hero-slide--advisory {
            --hero-img: url('/assets/hero/slide-advisory.jpg');
            --hero-ov: linear-gradient(135deg, rgba(29,52,96,0.65) 0%, rgba(36,66,114,0.62) 40%, rgba(46,95,163,0.68) 100%);
            --hero-pan: heroPanRise;
        }
        .hero-slide--insights {
            --hero-img: url('/assets/hero/slide-insights.jpg');
            --hero-ov: linear-gradient(135deg, rgba(22,42,77,0.68) 0%, rgba(28,49,88,0.65) 50%, rgba(46,95,163,0.68) 100%);
            --hero-pan: heroPanRight;
        }
        .hero-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .hero-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--hero-img) center/cover no-repeat;
            transform: scale(1.16) translate3d(-6%, 0, 0);
            will-change: transform;
            backface-visibility: hidden;
        }
        .hero-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--hero-ov);
        }
        .hero-slide.active .hero-bg::before,
        .hero-slide.leaving .hero-bg::before {
            animation: var(--hero-pan) 7s linear forwards;
        }
        @keyframes heroPanRight {
            from { transform: scale(1.16) translate3d(-6%, 0.8%, 0); }
            to   { transform: scale(1.18) translate3d(6%, -0.8%, 0); }
        }
        @keyframes heroPanLeft {
            from { transform: scale(1.16) translate3d(6%, -0.8%, 0); }
            to   { transform: scale(1.18) translate3d(-6%, 0.8%, 0); }
        }
        @keyframes heroPanRise {
            from { transform: scale(1.24) translate3d(-4%, 4%, 0); }
            to   { transform: scale(1.12) translate3d(4%, -3%, 0); }
        }
    });

    // ── Hero Slider ──
    const slides = document.querySelectorAll('.hero-slide');
    const dots = document.querySelectorAll('.hero-dot');
    const slideNum = document.getElementById('slideNum');
    let current = 0;
    let autoTimer;

    function goToSlide(index) {
        if (index === current) return;
        const prev = slides[current];
        prev.classList.remove('active');
        prev.classList.add('leaving');   // keep the pan moving while it fades out
        setTimeout(() => prev.classList.remove('leaving'), 900);
        dots[current].classList.remove('active');
        current = index;
        const next = slides[current];
        next.classList.remove('leaving');
        void next.offsetWidth;            // restart the pan from the beginning
        next.classList.add('active');
        dots[current].classList.add('active');
        slideNum.textContent = String(current + 1).padStart(2, '0');
    }

    function nextSlide() {
        goToSlide((current + 1) % slides.length);
    }

    function startAuto() {
        autoTimer = setInterval(nextSlide, 5000);
    }

    function resetAuto() {
        clearInterval(autoTimer);
        startAuto();
    }

    dots.forEach(dot => {
        dot.addEventListener('click', () => {
            goToSlide(parseInt(dot.dataset.index));
            resetAuto();
        });
    });

    // Pause only while the browser tab is hidden (not on mouse hover,
    // since the hero fills most of the screen and hover stalled the slider)
    const hero = document.getElementById('hero');
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) clearInterval(autoTimer); else resetAuto();
    });

    // Touch swipe support
    let touchStartX = 0;
    hero.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    hero.addEventListener('touchend', (e) => {
        const diff = touchStartX - e.changedTouches[0].screenX;
        if (Math.abs(diff) > 50) {
            if (diff > 0) goToSlide((current + 1) % slides.length);
            else goToSlide((current - 1 + slides.length) % slides.length);
            resetAuto();
        }
    }, { passive: true });

    startAuto();

    // ── Scroll animations ──
    const animObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry, i) => {
            if (entry.isIntersecting) {
                setTimeout(() => entry.target.classList.add('visible'), i * 60);
                animObserver.unobserve(entry.target);
            }
        });
    }, { threshold: 0.12, rootMargin: '0px 0px -30px 0px' });
    document.querySelectorAll('.anim').forEach(el => animObserver.observe(el));
})();
</script>
<script src="/assets/disclaimer.js" defer></script>
</body>
</html>
